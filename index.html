<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics Canada Data Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Vega and Vega-Lite libraries -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Data to Add</h2>
            <div class="control-panel">
                <div id="vector-inputs">
                    <div class="vector-input">
                        <label for="vector-id-1">Vector ID:</label>
                        <input type="text" id="vector-id-1" class="vector-id" placeholder="e.g. 32164132" value="32164132">
                        
                        <label for="periods-1">Number of latest periods</label>
                        <input type="number" id="periods-1" class="periods" min="1" max="100" value="3">
                    </div>
                </div>
                
                <button id="add-vector" class="btn">Add Vector</button>
                <button id="fetch-data" class="btn primary">Fetch Data</button>
                
                <div class="visualization-controls">
                    <h3>Chart Type</h3>
                    <div class="viz-buttons">
                        <button id="line-chart" class="viz-btn active">Line</button>
                        <button id="scatter-chart" class="viz-btn">Scatter</button>
                        <button id="bar-chart" class="viz-btn">Bar</button>
                        <button id="table-view" class="viz-btn">Table</button>
                    </div>
                    
                    <!-- Chart-specific options -->
                    <div id="chart-options">
                        <!-- Line chart options -->
                        <div id="line-options" class="chart-option-group">
                            <h3>Line Chart Options</h3>
                            <div class="option-item">
                                <input type="checkbox" id="line-show-points" checked>
                                <label for="line-show-points">Show data points</label>
                            </div>
                        </div>
                        
                        <!-- Scatter chart options -->
                        <div id="scatter-options" class="chart-option-group hidden">
                            <h3>Scatter Chart Options</h3>
                            <div class="option-item">
                                <label for="point-size">Point size:</label>
                                <input type="range" id="point-size" min="10" max="100" value="40">
                            </div>
                        </div>
                        
                        <!-- Bar chart options -->
                        <div id="bar-options" class="chart-option-group hidden">
                            <h3>Bar Chart Options</h3>
                            <div class="option-item">
                                <input type="checkbox" id="show-totals">
                                <label for="show-totals">Show combined totals</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <h1>Statistics Canada Charts</h1>
            <h2 id="cube-title" class="hidden">Cube Title</h2>
            <div id="loading" class="hidden">Loading data...</div>
            <div id="visualization-container">
                <div id="visualization"></div>
                <div class="zoom-instructions">
                    <p><strong>Zoom Controls:</strong> Click and drag to zoom in, use mouse wheel to zoom in/out, double-click to reset view</p>
                </div>
            </div>
            <div id="table-container" class="hidden"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
